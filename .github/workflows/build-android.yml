name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull requests and ordinary builds receive only repository read access. The
# release job elevates this explicitly when it attaches an APK to a version tag.
permissions:
  contents: read

jobs:
  verify-release-version:
    name: Verify release tag matches client version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tagged release version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.cjs "$GITHUB_REF_NAME"

  build-apk:
    name: Build Android APK
    needs: verify-release-version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/GithubStarsManager-debug.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: GithubStarsManager-Android-APK
          path: output/GithubStarsManager-debug.apk
          retention-days: 30

  release:
    name: Publish Android APK
    needs: [verify-release-version, build-apk]
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify-release-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: GithubStarsManager-Android-APK
          path: output

      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: output/GithubStarsManager-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Android

            这个版本附带可侧载的 Android APK（debug 签名）。GitHub Actions 不再构建桌面端安装包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
